<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Quimicando com França</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js" defer></script><script src="auth.js" defer></script></head><body><header class="topbar"><a class="marca" href="index.html"><span class="simbolo">∑</span><span>QUIMICANDO <small>COM FRANÇA</small></span></a><a href="index.html">Voltar ao site</a></header><main class="page-wrap"><section class="panel form-panel"><h1>Área do aluno</h1><p class="muted">Entre na sua conta ou crie seu cadastro para comprar e acessar seus cursos.</p><div class="tabs"><button id="tabLogin" class="active" type="button">Entrar</button><button id="tabCadastro" type="button">Criar conta</button></div><form id="authForm"><div id="nomeField" class="field hidden"><label for="nome">Nome completo</label><input id="nome" autocomplete="name"></div><div class="field"><label for="telefone">Telefone com DDD</label><input id="telefone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="(38) 99999-9999"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" required minlength="8" autocomplete="current-password"></div><button id="submitAuth" class="btn" style="width:100%">Entrar</button></form><p id="feedback" class="feedback" role="status"></p><p class="muted">Informe seu telefone para que ele fique associado à sua conta e às compras dos cursos.</p></section></main></body></html>
